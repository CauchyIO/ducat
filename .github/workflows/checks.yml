name: checks

on:
  push:
  pull_request:

jobs:
  package:
    name: credentials and estate identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
      - name: Scan tracked files
        run: git ls-files -z | xargs -0 uv run tools/check-package.py

  consistency:
    name: consistency — review dates, routing, links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
      - name: Scan tracked markdown
        run: git ls-files -z '*.md' | xargs -0 uv run tools/check-consistency.py
