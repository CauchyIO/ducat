# Weekly: has an upstream source the reference files were distilled from moved?
#
# Not part of `checks`. Those hooks are offline and deterministic and gate a commit;
# this one reaches the network, and committing must never depend on Microsoft or GitHub
# being reachable. It runs on its own clock and raises an issue instead of blocking.
#
# Exit codes from tools/check-upstream.py drive what happens:
#   0  nothing moved — the run is green and silent
#   1  a source moved — a human owes a re-read, so an issue is raised
#   2  a source could not be read — the run fails without inventing a re-read
name: upstream sources

on:
  schedule:
    # Mondays 07:00 UTC. Weekly matches the pace these sources actually move; a daily
    # run would find nothing on six days out of seven and train people to ignore it.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  upstream:
    name: distillation sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Compare each pinned signal against the live source
        id: check
        # Both streams are kept: stderr carries the findings, and the exit code decides
        # what they mean. `set +e` so a non-zero code reaches the next step as data.
        run: |
          set +e
          uv run --locked tools/check-upstream.py > result.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat result.txt

      - name: Raise or update the issue for a moved source
        if: steps.check.outputs.exit == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: An upstream distillation source has moved
        # One issue, then comments on it. A source stays moved until somebody re-distils
        # it, so a fresh issue every Monday would teach people to ignore the tracker.
        #
        # The open issues are listed and filtered here rather than searched: `--search`
        # goes through GitHub's search index, which is eventually consistent, and an
        # index that has not caught up would file a duplicate.
        run: |
          set -euo pipefail
          {
            echo "The weekly upstream check found a source whose published signal no longer"
            echo "matches the one pinned in \`tools/check-upstream.py\`. Re-read each source"
            echo "named below, re-distil the files it feeds, and re-pin its signal."
            echo
            echo "Re-pinning alone closes nothing: the pin would then say the source is"
            echo "unchanged since today, over a reference file nobody re-read."
            echo
            echo '```'
            cat result.txt
            echo '```'
            echo
            echo "Raised by [\`upstream-sources.yml\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } > body.md

          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == env.TITLE)) | first | .number // empty")

          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
            echo "commented on #$number"
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi

      - name: Fail if a source could not be read
        if: steps.check.outputs.exit != '0'
        run: |
          echo "check-upstream exited ${{ steps.check.outputs.exit }}"
          exit 1
